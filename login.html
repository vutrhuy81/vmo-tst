<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Ôn luyện VMO Đà Nẵng 2026 - 2027 & TST Toàn Quốc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <script>
    // Nếu đã đăng nhập thì tự động chuyển hướng ngay sang index.html
    VMOAuth.redirectIfLoggedIn('index.html');
  </script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-dark: #0f172a;
      --accent: #f59e0b;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgba(30, 58, 138, 0.9) 0%, rgba(15, 23, 42, 1) 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #ffffff;
      position: relative;
      overflow-x: hidden;
    }

    /* Math decorative pattern in background */
    .bg-math-decor {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      opacity: 0.06;
      font-family: 'Times New Roman', serif;
      font-style: italic;
      user-select: none;
      overflow: hidden;
    }
    .math-symbol {
      position: absolute;
      font-size: 5rem;
      color: white;
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      color: var(--text);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      animation: fadeInUp 0.4s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.84rem;
      font-weight: 600;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary-light);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .toggle-pw-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .toggle-pw-btn:hover {
      color: var(--text);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-login {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* ERROR & SUCCESS ALERTS */
    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 500;
      align-items: center;
      gap: 10px;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* DEFAULT ACCOUNTS CALLOUT */
    .default-creds-card {
      margin-top: 24px;
      background: #f1f5f9;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.5;
    }

    .default-creds-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .creds-kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 10px;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    .creds-kv span.val {
      font-weight: 600;
      color: #0f172a;
      background: #ffffff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      display: inline-block;
      width: fit-content;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Decorative Math Background -->
  <div class="bg-math-decor">
    <div class="math-symbol" style="top: 10%; left: 8%;">$$\int_a^b$$</div>
    <div class="math-symbol" style="top: 20%; right: 12%;">$$\sum_{k=1}^n$$</div>
    <div class="math-symbol" style="bottom: 15%; left: 15%;">$$\sqrt{x^2+y^2}$$</div>
    <div class="math-symbol" style="bottom: 25%; right: 10%;">$$\sigma_k(n)$$</div>
    <div class="math-symbol" style="top: 50%; left: 45%;">$$\pi$$</div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-badge">🇻🇳 VMO ĐÀ NẴNG 2026 - 2027</div>
        <h1 class="login-title">ĐĂNG NHẬP HỆ THỐNG</h1>
        <p class="login-subtitle">Vui lòng đăng nhập để truy cập tài liệu ôn luyện chuyên sâu và ngân hàng đề thi TST toàn quốc</p>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <form id="loginForm" class="login-form" autocomplete="on">
        <div class="input-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            <button type="button" id="btnTogglePw" class="toggle-pw-btn" title="Hiện/Ẩn mật khẩu">👁️</button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <button type="submit" id="btnLogin" class="btn-login">
          <span>Đăng nhập hệ thống</span>
          <span>→</span>
        </button>
      </form>    

    <div class="login-footer">
      <p>© 2026 - 2027 Hệ thống Dữ liệu Bồi dưỡng Học sinh Giỏi Toán Quốc gia</p>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const alertBox = document.getElementById('alertBox');
    const btnTogglePw = document.getElementById('btnTogglePw');
    const btnLogin = document.getElementById('btnLogin');

    // Toggle show/hide password
    btnTogglePw.addEventListener('click', () => {
      const isPw = passwordInput.type === 'password';
      passwordInput.type = isPw ? 'text' : 'password';
      btnTogglePw.textContent = isPw ? '🙈' : '👁️';
    });

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'flex';
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = usernameInput.value.trim();
      const p = passwordInput.value.trim();
      const remember = rememberMeCheckbox.checked;

      if (!u || !p) {
        showAlert('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span>Đang xác thực...</span>';

      setTimeout(() => {
        const res = VMOAuth.login(u, p, remember);
        if (res.success) {
          showAlert('✅ Đăng nhập thành công! Đang chuyển hướng vào trang chính...', true);
          setTimeout(() => {
            window.location.replace('index.html');
          }, 400);
        } else {
          showAlert(res.message || 'Tên đăng nhập hoặc mật khẩu không đúng!');
          btnLogin.disabled = false;
          btnLogin.innerHTML = '<span>Đăng nhập hệ thống</span><span>→</span>';
          passwordInput.focus();
        }
      }, 300);
    });
  </script>
</body>
</html>
